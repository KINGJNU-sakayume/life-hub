name: Deploy (Cloudflare)

# Manual only: run from the GitHub Actions tab (works from the GitHub mobile app).
# Nothing deploys automatically on push, so merging code never exposes a new Worker by itself.
on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending D1 migrations to the remote database before deploying
        type: boolean
        default: true
      deploy_worker:
        description: Deploy the Worker after migrations
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Optional: add required reviewers to the "production" environment in repo settings.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run checks
        run: npm run check

      - name: Verify deploy secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          HUB_PUBLIC_ORIGIN: ${{ vars.HUB_PUBLIC_ORIGIN }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID KV_NAMESPACE_ID HUB_PUBLIC_ORIGIN; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret or variable $name is not set"; missing=1; fi
          done
          exit $missing

      - name: Render wrangler.jsonc (not committed)
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          HUB_PUBLIC_ORIGIN: ${{ vars.HUB_PUBLIC_ORIGIN }}
          HUB_PALATE_REDIRECT_URI: ${{ vars.HUB_PALATE_REDIRECT_URI }}
          HUB_KYEOKYEOI_REDIRECT_URI: ${{ vars.HUB_KYEOKYEOI_REDIRECT_URI }}
          HUB_POTCAST_REDIRECT_URI: ${{ vars.HUB_POTCAST_REDIRECT_URI }}
          HUB_ACHIEVEMENT_REDIRECT_URI: ${{ vars.HUB_ACHIEVEMENT_REDIRECT_URI }}
          HUB_LETTERBOOKXD_REDIRECT_URI: ${{ vars.HUB_LETTERBOOKXD_REDIRECT_URI }}
          HUB_SUB_REDIRECT_URI: ${{ vars.HUB_SUB_REDIRECT_URI }}
          HUB_ANIMAN_REDIRECT_URI: ${{ vars.HUB_ANIMAN_REDIRECT_URI }}
          HUB_SPOTIFY_CLIENT_ID: ${{ vars.HUB_SPOTIFY_CLIENT_ID }}
        run: node scripts/render-wrangler-config.mjs wrangler.example.jsonc wrangler.jsonc

      - name: Apply D1 migrations (remote)
        if: ${{ inputs.apply_migrations }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 migrations apply life-hub-private --remote --config wrangler.jsonc

      - name: Deploy Worker
        if: ${{ inputs.deploy_worker }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          # --keep-vars preserves HUB_* secrets/variables set in the Cloudflare dashboard.
          command: deploy --config wrangler.jsonc --keep-vars

      - name: Remove rendered config
        if: always()
        run: rm -f wrangler.jsonc
